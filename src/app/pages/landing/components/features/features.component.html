<section class="section features" id="features">
    <div class="container">
        <div class="text-center">
            <div class="tag">
                <span class="material-icons-round" style="font-size: 14px">stars</span>
                Everything You Need
            </div>
            <h2 class="section-title">Built for Modern Healthcare</h2>
            <p class="section-subtitle">
                Every tool your clinic needs to run efficiently — from scheduling to analytics — in one seamless
                platform.
            </p>
        </div>

        <div class="features__grid">
            @for (feature of features; track feature.title) {
                <div class="feature-card">
                    <div
                        class="feature-card__icon"
                        [style.background]="feature.color + '18'"
                        [style.color]="feature.color"
                    >
                        <span class="material-icons-round">{{ feature.icon }}</span>
                    </div>
                    <h3 class="feature-card__title">{{ feature.title }}</h3>
                    <p class="feature-card__desc">{{ feature.desc }}</p>
                </div>
            }
        </div>
    </div>
</section>
