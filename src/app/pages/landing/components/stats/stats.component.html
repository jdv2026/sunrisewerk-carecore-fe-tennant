<section class="stats">
    <div class="container">
        <div class="stats__grid">
            @for (stat of stats; track stat.label) {
                <div class="stats__item">
                    <div class="stats__value">{{ stat.value }}</div>
                    <div class="stats__label">{{ stat.label }}</div>
                </div>
            }
        </div>
    </div>
</section>
